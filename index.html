<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕관과 장원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  @font-face { font-family:"Galmuri11"; src:url("fonts/Galmuri11.woff2") format("woff2"); font-weight:400; font-display:swap; }
  @font-face { font-family:"Galmuri11"; src:url("fonts/Galmuri11-Bold.woff2") format("woff2"); font-weight:700; font-display:swap; }
  /* Layout: pixel top bar, map (left) + tabbed side panel (right), chronicle log; stacks to one column on phones. Single dark look by design. */
  :root {
    --bg:#15111b; --bg2:#1f1927; --wood:#3b2b25; --wood2:#4f3a30; --woodhi:#6e5242; --edge:#0a070c;
    --gold:#e8b84a; --gold2:#a87a24; --goldhi:#ffe39a; --text:#f1e4c3; --dim:#ab9a7e;
    --bad:#ee6b54; --good:#a4d474; --blue:#86aef0;
    --font:"Galmuri11","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;
    color-scheme:dark;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--text); font:12px/1.6 var(--font);
         padding-block:12px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
         -webkit-font-smoothing:none; }
  .px { image-rendering:pixelated; image-rendering:crisp-edges; }
  b, strong { font-weight:700; }
  #app { max-width:1200px; margin:0 auto; display:flex; flex-direction:column; gap:10px; }
  .panel { background:var(--wood); border:3px solid var(--edge); box-shadow:inset 0 0 0 2px var(--woodhi), inset 0 0 0 4px var(--wood); }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 12px; }
  .logo { font-size:24px; font-weight:700; color:var(--gold); text-shadow:2px 2px 0 var(--edge); margin-right:auto; line-height:1.2; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--bg2); border:2px solid var(--edge); padding:2px 8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .chip small { color:var(--dim); font-size:12px; }
  .chip.warn { border-color:var(--bad); color:var(--bad); }
  .speed { display:flex; gap:2px; }
  .main { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:10px; align-items:start; }
  @media (max-width:900px) { .main { grid-template-columns:minmax(0,1fr); } }
  .mapwrap { padding:8px; }
  .mapin { position:relative; }
  #map { display:block; width:100%; aspect-ratio:448/280; max-width:100%; cursor:pointer; background:#284673; }
  #labels { position:absolute; inset:0; pointer-events:none; }
  .lbl { position:absolute; transform:translate(-50%,-100%); font-size:12px; font-weight:700; color:#fff; white-space:nowrap;
         text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000,1px 1px 0 #000; }
  .lbl.mine { color:var(--goldhi); }
  .lbl img { width:12px; height:12px; vertical-align:-1px; margin-right:1px; }
  .dlbl { position:absolute; transform:translate(-50%,-50%); font-size:24px; font-weight:700; color:rgba(255,246,214,.82); white-space:nowrap; letter-spacing:2px;
          text-shadow:2px 0 0 #1a1420,-2px 0 0 #1a1420,0 2px 0 #1a1420,0 -2px 0 #1a1420; }
  @media (max-width:600px) { .dlbl { font-size:12px; letter-spacing:1px; } .lbl:not(.mine):not(.sel) { display:none; } }
  .mapbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:8px; }
  .mapbar .dim { flex:1; min-width:200px; }
  .vote { display:grid; grid-template-columns:minmax(0,1fr) 120px 28px; gap:8px; align-items:center; }
  .maphint { color:var(--dim); padding:6px 2px 0; }
  .side { padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .sec { color:var(--gold); font-weight:700; border-bottom:2px solid var(--edge); padding-bottom:2px; margin-top:4px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .col { display:flex; flex-direction:column; gap:6px; }
  .card { display:flex; gap:10px; align-items:flex-start; }
  .card > div { min-width:0; }
  .nm { font-weight:700; font-size:12px; color:var(--goldhi); }
  .dim { color:var(--dim); }
  .bad { color:var(--bad); } .good { color:var(--good); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .st { background:var(--bg2); border:2px solid var(--edge); padding:2px 5px; display:flex; justify-content:space-between; gap:4px; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; background:var(--bg2); border:2px solid var(--edge); padding:0 6px; }
  .tag.blue { color:var(--blue); }
  .tag.gold { color:var(--gold); }
  .tag.good { color:var(--good); border-color:#2f4a22; }
  .tag.bad { color:var(--bad); border-color:#5a2018; }
  .tag.trait { cursor:help; }
  .t-e { color:var(--blue); } .t-c { color:var(--good); } .t-c.neg, .t-h { color:var(--bad); } .t-l { color:#c9a0f4; } .t-s { color:#f0a860; } .t-k { color:var(--dim); }
  .btn { font:inherit; color:var(--text); background:var(--wood2); border:2px solid var(--edge);
         box-shadow:inset -2px -2px 0 var(--wood), inset 2px 2px 0 var(--woodhi);
         padding:4px 8px; cursor:pointer; text-align:left; display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; line-height:1.5; }
  .btn small { color:var(--dim); font-size:12px; }
  .btn:hover:not(:disabled) { background:#5e463a; }
  .btn:active:not(:disabled) { box-shadow:inset 2px 2px 0 var(--wood); transform:translateY(1px); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  .btn.gold, .btn.on { background:var(--gold); color:#2a1806; box-shadow:inset -2px -2px 0 var(--gold2), inset 2px 2px 0 var(--goldhi); }
  .btn.gold small, .btn.on small { color:#5a3a10; }
  .btn.gold .good, .btn.on .good { color:#2c5410; } .btn.gold .bad, .btn.on .bad { color:#8a1e10; }
  .btn.wide { width:100%; }
  .slot { background:var(--bg2); border:2px solid var(--edge); padding:8px; display:flex; flex-direction:column; gap:6px; }
  .slot.empty { border:2px dashed var(--woodhi); background:transparent; }
  .sh { display:flex; gap:8px; align-items:center; }
  .i16 { width:16px; height:16px; } .i32 { width:32px; height:32px; }
  .pf48 { width:48px; height:48px; flex:none; } .pf72 { width:72px; height:72px; flex:none; } .pf96 { width:96px; height:96px; flex:none; }
  .meter { display:inline-block; width:64px; height:8px; background:var(--edge); vertical-align:middle; border:1px solid var(--edge); }
  .meter i { display:block; height:100%; background:var(--gold); }
  .meter.green i { background:var(--good); }
  .prog { height:8px; background:var(--edge); width:100%; } .prog i { display:block; height:100%; background:var(--good); }
  .prog.red i { background:var(--bad); } .prog.gold i { background:var(--gold); }
  .slot.war { border-color:var(--bad); background:#2a1414; }
  .slot.plot { border-color:#5a3a7a; background:#1f1630; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  .note { background:var(--bg2); border:2px solid var(--edge); padding:6px 8px; }
  .note.bad { border-color:var(--bad); }
  #log { height:132px; overflow:auto; padding:8px 12px; }
  #log p { margin:0; }
  #log .d { color:var(--dim); margin-right:6px; font-variant-numeric:tabular-nums; }
  #modal { position:fixed; inset:0; background:rgba(8,5,12,.74); display:flex; align-items:center; justify-content:center; z-index:20;
           padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .win { width:100%; max-width:540px; max-height:100%; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .wtitle { font-size:24px; font-weight:700; color:var(--gold); line-height:1.25; text-shadow:2px 2px 0 var(--edge); text-wrap:balance; }
  .wbody { display:flex; gap:12px; align-items:flex-start; }
  .wbody p { margin:0; line-height:1.7; }
  .scene { display:inline-flex; align-items:flex-end; justify-content:center; padding:4px 8px 0; background:linear-gradient(180deg,#2e2540 0%,#1a1424 70%,#120d18 100%); border:3px solid var(--edge); box-shadow:0 0 0 2px var(--gold2); }
  .chr { display:inline-block; flex:none; background-repeat:no-repeat; background-position-x:0; image-rendering:pixelated; image-rendering:crisp-edges; }
  body.f1 .chr { background-position-x:100%; }
  .chr.big { width:208px; height:368px; background-size:416px 368px; }
  .chr.mid { width:104px; height:184px; background-size:208px 184px; background-color:#1f1828; box-shadow:inset 0 0 0 2px var(--edge); }
  .chr.bust { width:104px; height:96px; background-size:208px 184px; background-color:#1f1828; box-shadow:inset 0 0 0 2px var(--edge); }
  .vs { flex-wrap:wrap; }
  @media (max-width:480px) { .chr.big { width:156px; height:276px; background-size:312px 276px; } }
  .opts { display:flex; flex-direction:column; gap:6px; }
  .opts .btn { width:100%; flex-direction:column; align-items:flex-start; gap:0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .mcard { background:var(--bg2); border:2px solid var(--edge); padding:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .vs { display:flex; align-items:center; gap:10px; }
  .vs b { color:var(--gold); font-size:24px; }
  @media (max-width:480px) { .wbody { flex-direction:column; } .stats { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<main id="app">
  <header class="top panel">
    <div class="logo">왕관과 장원</div>
    <div class="chips" id="chips"></div>
    <div class="speed" id="speed"></div>
    <button class="btn" data-a="help" title="도움말">?</button>
  </header>
  <div class="main">
    <section class="mapwrap panel">
      <div class="mapin">
        <canvas id="map" class="px" width="448" height="280" aria-label="제국 지도"></canvas>
        <div id="labels"></div>
      </div>
      <div class="mapbar" id="mapbar"></div>
    </section>
    <aside class="side panel">
      <div class="tabs" id="tabs"></div>
      <div id="side" class="col"></div>
    </aside>
  </div>
  <section id="log" class="panel" aria-live="polite"></section>
  <div id="modal" hidden></div>
</main>
<script>
"use strict";
// ================= 기본 도구 =================
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f1 = n => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, "");
const pct = p => Math.round(p * 100);
const $ = id => document.getElementById(id);
function mulberry(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function toHex(c) { return "#" + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, "0")).join(""); }
function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function shade(h, t) { return toHex(mix(hex(h), t < 0 ? [0, 0, 0] : [255, 255, 255], Math.abs(t))); }
const REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
// 한국어 조사
const jong = w => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return (c >= 0 && c <= 11171) ? c % 28 : 0; };
const josa = (w, a, b) => jong(w) ? a : b;
const iga = w => w + josa(w, "이", "가"), eunneun = w => w + josa(w, "은", "는"), eulreul = w => w + josa(w, "을", "를"), gwawa = w => w + josa(w, "과", "와");
const euro = w => w + (jong(w) === 0 || jong(w) === 8 ? "로" : "으로");

// ================= 게임 데이터 =================
const MN = ["알레인","고드윈","레오폴트","울릭","베르트람","오스윈","하랄","지그문트","테오발트","롤란트","아르눌프","기욤","에버하르트","콘라트","볼프람"];
const FN = ["이졸데","마틸다","엘레오노르","베아트릭스","아델라","길다","로자문드","헤드비히","클로틸드","에르멘가르드","시빌라","아그네스","유디트"];
const STATS = [["dip","외교"],["mar","군사"],["stw","관리"],["int","음모"],["lrn","학식"],["pro","무용"]];
const STAT_NAME = Object.fromEntries(STATS);
const FOCI = ["dip", "mar", "stw", "int", "lrn"];   // 교육·생활 방식에 쓰는 다섯 능력치 (무용 제외)
const STAT_HELP = { dip:"위신 획득·통제력 회복·선제후 호감", mar:"병력·지휘력", stw:"세수·직할 한도", int:"음모 성공률·암살 방어", lrn:"신앙심·개발도", pro:"개인 무력: 전투력·결투·전사 위험" };
const ALL5 = v => ({ dip:v, mar:v, stw:v, int:v, lrn:v });
// cat: p 성격 · e 교육 · c 선천 · l 생활 · h 건강 · s 스트레스 해소 · k 어린 시절
const TRAITS = {
  brave:{ n:"용맹", cat:"p", fx:{ mar:2, pro:3 }, opp:"craven" },             craven:{ n:"겁쟁이", cat:"p", fx:{ mar:-2, pro:-3, int:2 }, opp:"brave" },
  calm:{ n:"침착", cat:"p", fx:{ dip:1, int:1 }, opp:"wrathful" },            wrathful:{ n:"다혈질", cat:"p", fx:{ mar:3, dip:-1, int:-1 }, opp:"calm" },
  diligent:{ n:"근면", cat:"p", fx:ALL5(1), opp:"lazy" },                     lazy:{ n:"나태", cat:"p", fx:ALL5(-1), opp:"diligent" },
  generous:{ n:"관대", cat:"p", fx:{ dip:3 }, income:-0.05, opp:"greedy" },    greedy:{ n:"탐욕", cat:"p", fx:{ dip:-2 }, income:0.1, opp:"generous" },
  honest:{ n:"정직", cat:"p", fx:{ dip:2, int:-4 }, opp:"deceitful" },        deceitful:{ n:"기만", cat:"p", fx:{ int:4, dip:-2 }, opp:"honest" },
  humble:{ n:"겸손", cat:"p", fx:{}, piety:0.5, opp:"arrogant" },             arrogant:{ n:"오만", cat:"p", fx:{ dip:-1 }, prestige:0.5, opp:"humble" },
  just:{ n:"공정", cat:"p", fx:{ stw:2, lrn:1 }, opp:"arbitrary" },           arbitrary:{ n:"독단", cat:"p", fx:{ int:2, stw:-1, lrn:-1 }, opp:"just" },
  patient:{ n:"인내", cat:"p", fx:{ lrn:2 }, opp:"impatient" },              impatient:{ n:"성급", cat:"p", fx:{ lrn:-2 }, d:"음모가 2개월 빨리 끝남", opp:"patient" },
  temperate:{ n:"절제", cat:"p", fx:{ stw:2 }, death:0.85, opp:"gluttonous" }, gluttonous:{ n:"탐식", cat:"p", fx:{ stw:-2 }, death:1.25, opp:"temperate" },
  trusting:{ n:"신뢰", cat:"p", fx:{ dip:2, int:-2 }, opp:"paranoid" },       paranoid:{ n:"편집증", cat:"p", fx:{ int:2, dip:-1 }, d:"자객 발각 +15%", opp:"trusting" },
  zealous:{ n:"광신", cat:"p", fx:{ mar:2 }, piety:0.4, opp:"cynical" },      cynical:{ n:"냉소", cat:"p", fx:{ lrn:2, int:2 }, piety:-0.4, opp:"zealous" },
  compassionate:{ n:"자애", cat:"p", fx:{ dip:2, int:-2 }, opp:"callous" },   callous:{ n:"냉혹", cat:"p", fx:{ int:2, dip:-2 }, opp:"compassionate" },
  gregarious:{ n:"사교적", cat:"p", fx:{ dip:2 }, opp:"shy" },               shy:{ n:"수줍음", cat:"p", fx:{ dip:-2, lrn:1, int:1 }, opp:"gregarious" },
  ambitious:{ n:"야심", cat:"p", fx:{ ...ALL5(1), pro:1 }, prestige:0.2, opp:"content" }, content:{ n:"만족", cat:"p", fx:{ int:-2 }, ctrl:0.2, opp:"ambitious" },
  chaste:{ n:"순결", cat:"p", fx:{ lrn:2 }, fert:0.75, opp:"lustful" },       lustful:{ n:"호색", cat:"p", fx:{ int:2 }, fert:1.25, opp:"chaste" },
  forgiving:{ n:"관용", cat:"p", fx:{ dip:2, lrn:1, int:-2 }, opp:"vengeful" }, vengeful:{ n:"복수심", cat:"p", fx:{ int:2, dip:-2 }, opp:"forgiving" },
  stubborn:{ n:"고집", cat:"p", fx:{ stw:3 }, opp:"fickle" },                fickle:{ n:"변덕", cat:"p", fx:{ dip:2, stw:-2 }, opp:"stubborn" },
  // 선천 (유전) — grp 안에서 tier 가 높을수록 좋다
  imbecile:{ n:"백치", cat:"c", grp:"wit", tier:-3, fx:{ ...ALL5(-6), pro:-2 } }, stupid:{ n:"우둔", cat:"c", grp:"wit", tier:-2, fx:ALL5(-3) },
  slow:{ n:"미련", cat:"c", grp:"wit", tier:-1, fx:ALL5(-1) },              quick:{ n:"영리", cat:"c", grp:"wit", tier:1, fx:ALL5(1) },
  intelligent:{ n:"명석", cat:"c", grp:"wit", tier:2, fx:ALL5(3) },          genius:{ n:"천재", cat:"c", grp:"wit", tier:3, fx:ALL5(5) },
  feeble:{ n:"허약", cat:"c", grp:"body", tier:-1, fx:{ pro:-4 }, death:1.3 }, hale:{ n:"건장", cat:"c", grp:"body", tier:1, fx:{ pro:2 }, death:0.85 },
  robust:{ n:"강건", cat:"c", grp:"body", tier:2, fx:{ pro:4 }, death:0.75 }, herculean:{ n:"장사", cat:"c", grp:"body", tier:3, fx:{ pro:8 }, death:0.7 },
  homely:{ n:"못생김", cat:"c", grp:"look", tier:-1, fx:{ dip:-2 }, fert:0.8 }, comely:{ n:"수려", cat:"c", grp:"look", tier:1, fx:{ dip:1 } },
  beautiful:{ n:"아름다움", cat:"c", grp:"look", tier:2, fx:{ dip:2 }, fert:1.1 }, radiant:{ n:"절세", cat:"c", grp:"look", tier:3, fx:{ dip:4 }, fert:1.2 },
  // 생활 방식을 끝까지 익히면 얻는 특성
  diplomat:{ n:"외교가", cat:"l", fx:{ dip:3 } }, strategist:{ n:"전략가", cat:"l", fx:{ mar:3 } }, administrator:{ n:"행정가", cat:"l", fx:{ stw:3 } },
  schemer:{ n:"책략가", cat:"l", fx:{ int:3 } }, theologian:{ n:"신학자", cat:"l", fx:{ lrn:3 }, piety:0.3 },
  // 건강 (일시적)
  wounded:{ n:"부상", cat:"h", fx:{ pro:-2 }, death:1.6 }, ill:{ n:"병환", cat:"h", fx:ALL5(-1), death:4 },

  curious:{ n:"호기심쟁이", cat:"k", fx:{}, grows:["ambitious", "impatient", "cynical", "deceitful", "fickle", "brave"] },
  pensive:{ n:"사색가", cat:"k", fx:{}, grows:["calm", "patient", "shy", "zealous", "just", "temperate"] },
  bossy:{ n:"꼬마대장", cat:"k", fx:{}, grows:["arrogant", "ambitious", "stubborn", "just", "wrathful", "greedy"] },

// ================= 로그 · 팝업 =================
function say(t, cls) { G.log.push({ d:`${G.y}.${G.m}`, t, cls }); if (G.log.length > 150) G.log.shift(); }
function popup(p) { G.queue.push(p); }
const OK = (t = "알겠다") => [{ t, run:() => {} }];

// ================= 시간 흐름 =================
function step() {
  for (const c of own()) for (const s of c.slots) {
    if (!s) continue;
    if (s.under > 0) { if (--s.under === 0) { say(`${c.name}: ${HOLD[s.type].n} 완공`, "good"); mapDirty = true; } }
    else if (s.q && --s.q.left <= 0) { s.b.push(s.q.id); say(`${c.name}: ${BLD[s.q.id].n} 완공`, "good"); s.q = null; }
  }
  const sm = summary();
  G.gold += sm.income; G.prestige += sm.prestige; G.piety = Math.max(0, G.piety + sm.piety);
  for (const c of G.counties) {
    const cs = countyStat(c);
    if (c.owner === 0) {
      c.dev = Math.min(10, c.dev + (0.012 + cs.dev + rs("lrn") * 0.0012) * (perk("lrn", 2) ? 1.5 : 1));
      c.control = clamp(c.control + (cs.levy >= 20 ? 0.8 : -0.4) + rs("dip") * 0.03 + cs.ctrl + (G.law === "gavel" ? 0.2 : 0) + traitSum(G.ruler, "ctrl"), 0, 100);
    } else c.dev = Math.min(10, c.dev + 0.008);
  }
  if (!G.war) G.manpower = Math.min(1, G.manpower + (perk("mar", 2) ? 0.075 : 0.05));
  for (const r of G.realms) if (r.id && !r.dead) {
    if (!G.war || G.war.realm !== r.id) r.morale = Math.min(1, r.morale + 0.04);
    r.mul = Math.min(2.4, r.mul + 0.004);
    if (r.hostile > 0) r.hostile--;
  }
  for (const k in G.cd) if (G.cd[k] > 0) G.cd[k]--;
  for (const k in G.favor) G.favor[k] = Math.max(0, G.favor[k] - 0.2);
  if (G.truce > 0) G.truce--;
  G.ruler.stress = Math.max(0, (G.ruler.stress || 0) - 1 - traitSum(G.ruler, "relief"));
  lifestyleStep();
  for (const ch of [G.ruler, G.spouse, ...family()]) if (ch && ch.temp) for (const t in ch.temp) if (--ch.temp[t] <= 0) { removeTrait(ch, t); say(`${iga(ch.name)} ${TRAITS[t].n}에서 회복했습니다.`, "good"); }
  if (++G.m > 12) { G.m = 1; G.y++; for (const ch of allChars()) ch.age++; yearlyGrowth(); save(); }
  lifeAndDeath();
  if (G.over) return;
  vassalStep();
  if (G.war) { warStep(); if (G.over) return; }
  if (G.scheme) schemeStep();
  aiSchemes(); if (G.over) return;
  aiAggression();
  if (--G.nextEvent <= 0) { G.nextEvent = ri(5, 9); fireEvent(); }
}
function yearlyGrowth() {
  const heir = heirOf();
  for (const ch of [G.ruler, ...family()]) {
    if (ch.age - 1 >= 6 && ch.age - 1 <= 15) educateYear(ch);
    if (ch.age === 16 && ch.traits.some(t => TRAITS[t].cat === "k")) {
      const r = comeOfAge(ch);
      say(`${iga(ch.name)} 성년이 되었습니다: 「${TRAITS[r.edu].n}」, ${r.pers.map(t => TRAITS[t].n).join("·")}`, "good");
      if (ch === heir || ch === G.ruler) popup({ title:"성년식", img:charPortrait(ch, ch === G.ruler ? "player" : "family"),
        text:`${iga(ch.name)} 열여섯 살이 되어 성년식을 치렀습니다. ${r.kid ? `어린 시절 ${TRAITS[r.kid].n}였던 아이는 ` : ""}${r.pers.map(t => TRAITS[t].n).join(", ")}한 사람으로 자랐고, 교육을 마쳐 「${TRAITS[r.edu].n}」${josa(TRAITS[r.edu].n, "이", "가")} 되었습니다.`, opts:OK("훌륭하다") });
    }
  }
}
function lifeAndDeath() {
  if (G.spouse) {
    const mom = G.ruler.sex === "f" ? G.ruler : G.spouse;
    if (mom.age >= 16 && mom.age <= 44 && G.ruler.age >= 16 && G.kids.length < 7 && R() < 0.03 * traitMul(G.ruler, "fert") * traitMul(G.spouse, "fert")) {
      const k = makeChild(G.ruler, G.spouse); G.kids.push(k);
      say(`${G.kids.length === 1 ? "첫 아이" : "아이"} ${iga(k.name)} 태어났습니다.`, "good");
      if (G.kids.length === 1) popup({ title:"후계자 탄생", img:charPortrait(k, "family"), text:`${G.dyn} 가문에 ${k.sex === "m" ? "아들" : "딸"} ${iga(k.name)} 태어났습니다. 이제 가문의 대가 이어집니다.`, opts:OK("축복을 내린다") });
    }
  }
  for (const k of family()) if (R() < deathP(k)) {
    removeFamily(k);
    const ally = k.allyRealm != null && realmOf(k.allyRealm) && !realmOf(k.allyRealm).dead ? ` ${realmOf(k.allyRealm).name}과(와)의 동맹이 끝났습니다.` : "";
    say(`${iga(k.name)} ${k.age}세에 세상을 떠났습니다.${ally}`, "bad");
  }
  if (G.spouse && R() < deathP(G.spouse)) { say(`배우자 ${iga(G.spouse.name)} 세상을 떠났습니다.`, "bad"); G.spouse = null; }
  for (const r of G.realms) if (r.id && r.ruler && !r.dead && R() < deathP(r.ruler)) {
    const old = r.ruler, wasAlly = isAlly(r);
    r.ruler = mkChar({ sex:"m", age:r.theo ? ri(35, 55) : ri(16, 35) }); r.morale = Math.min(r.morale, 0.6);
    say(`${r.name}의 ${iga(old.name)} 죽고 ${iga(r.ruler.name)} 뒤를 이었습니다.${wasAlly && !isAlly(r) ? " 동맹이 끝났습니다." : ""}`);
    if (G.empire.realm === r.id) holdElection(`황제 ${iga(old.name)} 세상을 떠났습니다`);
  }
  if (R() < deathP(G.ruler)) succession("병");
}
function partition(heir, others) {
  const rest = own().filter(c => c.id !== G.capital);
  if (!rest.length || !others.length) return { parts:[], landed:[] };
  const cap = G.counties[G.capital], n = others.length + 1;
  rest.sort((a, b) => ((a.x - cap.x) ** 2 + (a.y - cap.y) ** 2) - ((b.x - cap.x) ** 2 + (b.y - cap.y) ** 2));
  const give = rest.slice(Math.ceil((rest.length + 1) / n) - 1);
  const shares = new Map();
  give.forEach((c, i) => { const k = others[i % others.length]; if (!shares.has(k)) shares.set(k, []); shares.get(k).push(c); });
  const parts = [], landed = [];
  for (const [k, cs] of shares) {
    const id = G.realms.length;
    const nm = `${cs[0].name} 백작령`;
    G.realms.push({ id, name:G.realms.some(x => x.name === nm) ? `${k.name}의 ${nm}` : nm, color:KIN_COLORS[id % KIN_COLORS.length], hat:"crown0", ruler:k, mul:1, morale:1, dead:false, hostile:0, kinId:k.id });
    for (const c of cs) { transferCounty(c, id); c.control = Math.min(c.control, 60); }
    k.allyRealm = null; k.married = null;
    parts.push(`${iga(k.name)} ${cs.map(c => c.name).join("·")}`); landed.push(k);
  }
  mapDirty = true;
  return { parts, landed };
}
function succession(cause) {
  const old = G.ruler, heir = heirOf();
  if (!heir) {
    G.over = true; G.speed = 0; G.war = null; G.scheme = null;
    popup({ title:"가문의 단절", img:charPortrait(old, "player"), text:`${G.y}년, ${eunneun(old.name)} ${euro(cause)} 세상을 떠났고 뒤를 이을 혈육이 없었습니다. ${G.dyn} 가문은 ${G.gen}대 만에 역사 속으로 사라졌습니다.`,
            opts:[{ t:"새 가문으로 다시 시작한다", run:() => newGame(true) }] });
    say(`${G.dyn} 가문이 단절되었습니다.`, "bad");
    return;
  }
  const wasKid = G.kids.includes(heir);
  let partText = "", landed = [];
  if (G.law === "gavel" && wasKid) {
    const others = G.kids.filter(k => k !== heir).sort((a, b) => b.age - a.age);
    const p = partition(heir, others); landed = p.landed;
    if (p.parts.length) partText = `<br><br>분할 상속에 따라 ${p.parts.join(", ")}${josa(p.parts[p.parts.length - 1], "을", "를")} 물려받아 독립했습니다. 그들은 형제가 다스리는 동안 우리의 동맹입니다.`;
  }
  G.sibs = family().filter(k => k !== heir && !landed.includes(k));
  G.kids = []; G.ruler = heir; G.spouse = null; G.gen++; G.lawLock = false;
  if (heir.married) {   // 이미 혼인한 후계자는 배우자를 데려온다
    const sp = mkChar({ sex:heir.sex === "m" ? "f" : "m", age:clamp(heir.age + ri(-4, 3), 16, 60) });
    sp.from = heir.married; sp.allyRealm = heir.allyRealm; G.spouse = sp; heir.married = null; heir.allyRealm = null;
  }
  G.prestige = Math.floor(G.prestige * 0.8);
  for (const c of own()) c.control = Math.max(0, c.control - 15);
  say(`${eunneun(old.name)} ${euro(cause)} 죽고, ${iga(heir.name)} ${G.gen}대 영주가 되었습니다.`, "bad");
  popup({ title:`${old.name}의 죽음`, img:charPortrait(old, "player"), img2:charPortrait(heir, "player"), sep:"→",
          text:`${G.y}년 ${G.m}월, ${old.age}세의 ${eunneun(old.name)} ${euro(cause)} 숨을 거두었습니다. ${heir.age}세의 ${iga(heir.name)} 가문의 ${G.gen}대 영주가 됩니다.${heir.age < 16 ? " 아직 어려 능력치가 절반만 발휘됩니다." : ""} 새 주군을 향한 의심으로 모든 영지의 통제력이 떨어졌습니다.${partText}`,
          opts:OK("새 주군 만세!") });
  if (isEmperor()) holdElection(`황제 ${iga(old.name)} 세상을 떠났습니다`);
}

function loop(t) {
  const dt = Math.min(250, t - lastT); lastT = t;
  if (G.speed > 0 && !G.queue.length && !G.over) {
    acc += dt; let n = 0;
    while (acc >= SPEED_MS[G.speed] && n < 3) { acc -= SPEED_MS[G.speed]; step(); n++; if (G.queue.length || G.over) { acc = 0; break; } }
    if (n) render();
  } else acc = 0;
  drawMap(t);
  requestAnimationFrame(loop);
}
function boot() {
  buildSprites(); genWorld(); genMap();
  const cv = $("map"); mapCtx = cv.getContext("2d");
  cv.addEventListener("click", e => {
    const b = cv.getBoundingClientRect();
    const x = Math.floor((e.clientX - b.left) / b.width * MW), y = Math.floor((e.clientY - b.top) / b.height * MH);
    const k = CMAP[clamp(y, 0, MH - 1) * MW + clamp(x, 0, MW - 1)];
    if (k >= 0) { G.sel = k; G.tab = "county"; lastFrame = -1; render(); }
  });
  newGame(false);
  if (!REDUCED && document.body) setInterval(() => document.body.classList.toggle("f1"), 650);
  requestAnimationFrame(loop);
}
boot();
</script>
