<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>왕관과 장원</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

  .nm { font-weight:700; font-size:12px; color:var(--goldhi); }
  .dim { color:var(--dim); }
  .bad { color:var(--bad); } .good { color:var(--good); }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .st { background:var(--bg2); border:2px solid var(--edge); padding:2px 5px; display:flex; justify-content:space-between; gap:4px; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; background:var(--bg2); border:2px solid var(--edge); padding:0 6px; }

           padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

</head>
<body>

    <aside class="side panel">

      <div id="side" class="col"></div>

  <div id="modal" hidden></div>
</main>

function stat(ch, k) {

function sumStats(ch) { return STATS.reduce((s, [k]) => s + stat(ch, k), 0); }
function rs(k) { return stat(G.ruler, k) + (G.spouse ? Math.floor(stat(G.spouse, k) / 2) : 0); }
function traitPiety(ch) { return ch.traits.reduce((s, t) => s + (TRAITS[t].piety || 0), 0); }

function deathP(ch) {

const eldest = list => [...list].sort((a, b) => b.age - a.age)[0];
function heirOf() {

  return eldest(G.kids) || eldest(G.sibs) || null;
}
function allChars() { return [G.ruler, G.spouse, ...G.kids, ...G.sibs, ...G.realms.map(r => r.dead ? null : r.ruler)].filter(Boolean); }
function family() { return [...G.kids, ...G.sibs]; }
function removeFamily(ch) { G.kids = G.kids.filter(k => k !== ch); G.sibs = G.sibs.filter(k => k !== ch); }

// ================= 외교 =================
function allyLink(r) {
  if (!r || !r.id || r.dead) return null;
  if (r.kinId && r.ruler.id === r.kinId) return r.ruler;
  return [G.spouse, ...family()].find(ch => ch && ch.allyRealm === r.id) || null;
}
const isAlly = r => !!allyLink(r);
function allyHelp(except) { return G.realms.filter(a => a.id && a !== except && isAlly(a)).reduce((s, a) => s + Math.round(aiArmy(a) * 0.5), 0); }
function marriageHouses() { return G.realms.filter(r => r.id && !r.dead && r.hat !== "mitre" && !(r.hostile > 0)); }

// ================= 경제 =================
function mkSlot(type) { return { type, b:[], q:null, under:0, vassal:null }; }
function own() { return G.counties.filter(c => c.owner === 0); }
function slotStat(s) {
  const h = HOLD[s.type], o = { tax:h.tax, levy:h.levy, piety:h.piety, prestige:0, dev:0, ctrl:0 };
  for (const id of s.b) { const b = BLD[id]; for (const k in o) o[k] += b[k] || 0; }
  return o;
}
function countyStat(c) {
  const o = { tax:0, levy:0, piety:0, prestige:0, dev:0, ctrl:0 };
  for (const s of c.slots) {
    if (!s || s.under) continue;
    const t = slotStat(s), mt = s.vassal ? 0.25 : 1, ml = s.vassal ? 0.5 : 1;
    o.tax += t.tax * mt; o.levy += t.levy * ml;
    if (!s.vassal) { o.piety += t.piety; o.prestige += t.prestige; o.dev += t.dev; o.ctrl += t.ctrl; }
  }
  o.factor = (0.4 + 0.6 * c.control / 100) * (1 + c.dev * 0.08);
  return o;
}
function domainCount() { let n = 0; for (const c of own()) for (const s of c.slots) if (s && !s.vassal) n++; return n; }
function domainLimit() { return BASE_LIMIT[G.rank] + Math.floor(rs("stw") / 5); }
function overPenalty() { const over = domainCount() - domainLimit(); return over > 0 ? Math.max(0.3, 1 - 0.15 * over) : 1; }
function summary() {
  let tax = 0, levy = 0, piety = 0, prestige = 0;
  for (const c of own()) { const s = countyStat(c); tax += s.tax * s.factor; levy += s.levy; piety += s.piety; prestige += s.prestige; }
  const maxLevy = Math.round(levy * (1 + rs("mar") * 0.03));
  return { income:tax * (1 + rs("stw") * 0.03) * overPenalty(), maxLevy, army:Math.round(maxLevy * G.manpower),
           prestige:prestige + 0.5 + rs("dip") * 0.06 + (G.law === "senior" ? 0.2 : 0),
           piety:piety + rs("lrn") * 0.03 + traitPiety(G.ruler) };
}
function aiArmy(r) {
  let lv = 0; for (const c of G.counties) if (c.owner === r.id) lv += countyStat(c).levy;

}
function adjToPlayer(ci) { return [...ADJ[ci]].some(j => G.counties[j].owner === 0); }
function realmAdj(r) { return G.counties.some(c => c.owner === r.id && adjToPlayer(c.id)); }

// ================= 전쟁 (달마다 진행) =================
function warRound(w, myMar, foeMar, rnd) {
  const iDef = !w.iAttack;
  const pa = w.my * (1 + myMar * 0.04) * (0.8 + rnd() * 0.4) * (iDef ? 1.15 : 1) * (w.luck || 1);
  const pb = w.foe * (1 + foeMar * 0.04) * (0.8 + rnd() * 0.4) * (iDef ? 1 : 1.15);
  w.foe = Math.max(0, w.foe - Math.round(pa * 0.08));
  w.my = Math.max(0, w.my - Math.round(pb * 0.08));
  const att = w.iAttack ? pa : pb, dfn = w.iAttack ? pb : pa;
  const myBroken = w.my <= w.myStart * 0.25, foeBroken = w.foe <= w.foeStart * 0.25;
  const attBroken = w.iAttack ? myBroken : foeBroken, defBroken = w.iAttack ? foeBroken : myBroken;
  if (defBroken) w.siege += 25; else if (att > dfn * 1.1) w.siege += 12; else if (att < dfn * 0.9) w.siege = Math.max(0, w.siege - 5);
  w.months++;
  if (w.siege >= 100) return w.iAttack ? "win" : "lose";
  if (attBroken) return w.iAttack ? "lose" : "win";
  if (w.months >= 24) return "peace";
  return null;
}
function warOdds(my, myMar, foe, foeMar, iAttack) {
  const rnd = mulberry(77); let win = 0;
  for (let i = 0; i < 200; i++) {
    const w = { my, foe, myStart:my, foeStart:foe, siege:0, months:0, iAttack, luck:0.75 + rnd() * 0.5 }; let res = null;
    while (!res) res = warRound(w, myMar, foeMar, rnd);
    if (res === "win") win++;
  }
  return Math.round(win / 2);
}
function startWar(r, c, iAttack) {
  const sm = summary(), allyStart = allyHelp(r), foe = aiArmy(r);
  G.war = { realm:r.id, county:c.id, iAttack, ownStart:sm.army, allyStart, my:sm.army + allyStart, myStart:sm.army + allyStart, foe, foeStart:foe, siege:0, months:0, luck:0.75 + R() * 0.5 };
  r.hostile = Math.max(r.hostile || 0, 24);
  say(iAttack ? `${r.name}에 선전포고했습니다. 목표: ${c.name}` : `${r.name}의 군대가 ${c.name}에 들이닥쳤습니다.`, "bad");
}
function warStep() {
  const w = G.war, r = realmOf(w.realm), c = G.counties[w.county];
  if (r.dead || (w.iAttack ? c.owner !== r.id : c.owner !== 0)) return endWar("peace", "전쟁의 목표가 사라져 전쟁이 끝났습니다.");
  const m0 = w.my, f0 = w.foe, res = warRound(w, rs("mar"), stat(r.ruler, "mar"), R);
  say(`${c.name} 전투 · 아군 ${w.my}(-${m0 - w.my}) 적군 ${w.foe}(-${f0 - w.foe}) · 공성 ${Math.min(100, w.siege)}%`);
  if (G.ruler.age >= 16 && R() < 0.003) { say(`${iga(G.ruler.name)} 전장에서 쓰러졌습니다.`, "bad"); succession("전투에서 입은 상처"); if (G.over || !G.war) return; }
  if (res) endWar(res);
}
function endWar(res, note) {
  const w = G.war, r = realmOf(w.realm), c = G.counties[w.county];
  G.war = null; G.truce = Math.max(G.truce, 12);
  const share = w.myStart ? w.ownStart / w.myStart : 1, maxLevy = summary().maxLevy;
  G.manpower = maxLevy ? clamp(w.my * share / maxLevy, 0, 1) : 1;
  if (w.foeStart) r.morale = clamp(r.morale * (w.foe / w.foeStart), 0.2, 1);
  let msg, mood = "";
  const strip = cc => { for (const s of cc.slots) if (s) { s.q = null; s.vassal = null; s.under = 0; } };
  if (note) msg = note;
  else if (w.iAttack) {
    if (res === "win") {
      c.owner = 0; c.control = 35; strip(c); G.prestige += 30; mapDirty = true; mood = "good";
      msg = `${eulreul(c.name)} 함락했습니다! 위신 +30`;
      if (!G.counties.some(x => x.owner === r.id)) { r.dead = true; msg += ` ${eunneun(r.name)} 멸망했습니다.`; }
    } else if (res === "lose") {
      const pay = Math.min(Math.floor(G.gold), 80); G.gold -= pay; G.prestige = Math.max(0, G.prestige - 20); mood = "bad";
      msg = `군대가 무너져 패전했습니다. 배상금 ${pay}, 위신 -20`;
    } else { G.prestige = Math.max(0, G.prestige - 10); msg = "끝없는 공성에 지쳐 백지 강화를 맺었습니다. 위신 -10"; }
  } else {
    if (res === "win") { G.prestige += 20; mood = "good"; msg = `${r.name}의 군대를 몰아냈습니다! 위신 +20`; }
    else if (res === "lose") {
      mood = "bad";

      else { G.gold = Math.max(0, G.gold - 150); G.prestige = Math.max(0, G.prestige - 30); msg = "수도가 포위되어 금화 150과 위신 30을 바치고 강화했습니다."; }
    } else msg = "양측 모두 지쳐 백지 강화를 맺었습니다.";

  popup({ title:mood === "good" ? "승전" : mood === "bad" ? "패전" : "강화", img:charPortrait(G.ruler, "player"), img2:charPortrait(r.ruler, r.id),
          text:`${w.months}개월에 걸친 전쟁이 끝났습니다. 남은 병력은 아군 ${w.my}, 적군 ${w.foe}입니다.<br>${msg}`, opts:OK() });
}

        opts:[

          { t:"공물을 바친다", fx:`💰 -${TRIBUTE} · 위신 -20`, run:() => { G.gold = Math.max(0, G.gold - TRIBUTE); G.prestige = Math.max(0, G.prestige - 20); say(`${r.name}에 공물을 바쳤습니다.`, "bad"); } },
        ] });

// ================= 음모 =================
function schemeChance(type, r) { const d = rs("int") - stat(r.ruler, "int"); return type === "kill" ? clamp(0.3 + d * 0.04, 0.05, 0.85) : clamp(0.55 + d * 0.04, 0.1, 0.95); }

function startScheme(type, r) {

  G.gold -= s.cost; G.scheme = { type, realm:r.id, target:r.ruler.id, left:s.time, total:s.time };
  say(`${r.ruler.name}을(를) 노린 ${s.n} 음모를 꾸미기 시작했습니다.`);

function schemeStep() {

    } else {

    }

    popup({ title:"음모 발각", img:charPortrait(target, r.id), text:`우리 첩자가 붙잡혀 모든 것을 털어놓았습니다. ${iga(target.name)} 분노했고, 온 세상이 ${G.dyn} 가문을 손가락질합니다. 위신 -40, ${r.name}${josa(r.name, "이", "가")} 5년간 적대합니다.`, opts:OK("부인한다") });
  } else {
    say(`${sname} 음모가 실패했지만 들키지는 않았습니다.`);
    popup({ title:"음모 실패", img:charPortrait(target, r.id), text:`${sname} 음모는 실패로 끝났습니다. 다행히 아무도 우리를 의심하지 않습니다.`, opts:OK() });
  }
}
function aiSchemes() {
  for (const r of G.realms) {

        opts:[{ t:"처형하고 만천하에 알린다", fx:`위신 +15 · ${r.name}과(와) 적대`, run:() => { G.prestige += 15; r.hostile = 60; } },
              { t:"이중 첩자로 돌려보낸다", fx:"영주 음모 +1", run:() => { G.ruler.st.int = (G.ruler.st.int || 0) + 1; } }] });
    } else if (R() < clamp(0.25 - rs("int") * 0.012, 0.04, 0.25)) {

// ================= 로그 · 팝업 =================
function say(t, cls) { G.log.push({ d:`${G.y}.${G.m}`, t, cls }); if (G.log.length > 150) G.log.shift(); }
function popup(p) { G.queue.push(p); }
const OK = (t = "알겠다") => [{ t, run:() => {} }];

// ================= 시간 흐름 =================
function step() {
  for (const c of own()) for (const s of c.slots) {
    if (!s) continue;
    if (s.under > 0) { if (--s.under === 0) { say(`${c.name}: ${HOLD[s.type].n} 완공`, "good"); mapDirty = true; } }
    else if (s.q && --s.q.left <= 0) { s.b.push(s.q.id); say(`${c.name}: ${BLD[s.q.id].n} 완공`, "good"); s.q = null; }
  }
  const sm = summary();
  G.gold += sm.income; G.prestige += sm.prestige; G.piety = Math.max(0, G.piety + sm.piety);
  for (const c of G.counties) {
    const cs = countyStat(c);
    if (c.owner === 0) {
      c.dev = Math.min(10, c.dev + 0.012 + cs.dev + rs("lrn") * 0.0012);
      c.control = clamp(c.control + (cs.levy >= 20 ? 0.8 : -0.4) + rs("dip") * 0.03 + cs.ctrl + (G.law === "gavel" ? 0.2 : 0), 0, 100);
    } else c.dev = Math.min(10, c.dev + 0.008);
  }
  if (!G.war) G.manpower = Math.min(1, G.manpower + 0.05);
  for (const r of G.realms) if (r.id && !r.dead) {
    if (!G.war || G.war.realm !== r.id) r.morale = Math.min(1, r.morale + 0.04);
    r.mul = Math.min(2.4, r.mul + 0.004);
    if (r.hostile > 0) r.hostile--;
  }
  for (const k in G.cd) if (G.cd[k] > 0) G.cd[k]--;
  if (G.truce > 0) G.truce--;
  if (++G.m > 12) { G.m = 1; G.y++; for (const ch of allChars()) ch.age++; save(); }
  lifeAndDeath();
  if (G.over) return;
  if (G.war) { warStep(); if (G.over) return; }
  if (G.scheme) schemeStep();

function partition(heir, others) {
  const rest = own().filter(c => c.id !== G.capital);
  if (!rest.length || !others.length) return { parts:[], landed:[] };
  const cap = G.counties[G.capital], n = others.length + 1;
  rest.sort((a, b) => ((a.x - cap.x) ** 2 + (a.y - cap.y) ** 2) - ((b.x - cap.x) ** 2 + (b.y - cap.y) ** 2));
  const give = rest.slice(Math.ceil((rest.length + 1) / n) - 1);
  const shares = new Map();
  give.forEach((c, i) => { const k = others[i % others.length]; if (!shares.has(k)) shares.set(k, []); shares.get(k).push(c); });
  const parts = [], landed = [];
  for (const [k, cs] of shares) {
    const id = G.realms.length;
    const nm = `${cs[0].name} 백작령`;
    G.realms.push({ id, name:G.realms.some(x => x.name === nm) ? `${k.name}의 ${nm}` : nm, color:KIN_COLORS[id % KIN_COLORS.length], hat:"crown0", ruler:k, mul:1, morale:1, dead:false, hostile:0, kinId:k.id });
    for (const c of cs) { c.owner = id; c.control = Math.min(c.control, 60); for (const s of c.slots) if (s) { s.q = null; s.under = 0; s.vassal = null; } }
    k.allyRealm = null; k.married = null;
    parts.push(`${iga(k.name)} ${cs.map(c => c.name).join("·")}`); landed.push(k);
  }
  mapDirty = true;
  return { parts, landed };
}

  G.gold -= HOLD_COST; const s = mkSlot(type); s.under = HOLD_TIME; c.slots[si] = s; mapDirty = true;
  say(`${c.name}에 ${HOLD[type].n} 건설을 시작했습니다.`);
}

  G.gold -= b.cost; s.q = { id, left:b.time }; say(`${c.name} ${HOLD[s.type].n}: ${b.n} 공사를 시작했습니다.`);

  setHTML(m, `<div class="win panel" role="dialog" aria-modal="true"><div class="wtitle">${p.title}</div>
    <div class="wbody" style="${p.img2 ? "flex-direction:column" : ""}">${imgs}<p>${p.text}</p></div>
    ${p.cards ? `<div class="cards">${p.cards.map((c, i) => `<div class="mcard"><img class="px pf72" src="${c.img}" alt="">${c.html}<div class="opts" style="width:100%">${btn(p.opts[i], i)}</div></div>`).join("")}</div>` : ""}
    <div class="opts">${p.opts.slice(n).map((o, i) => btn(o, i + n)).join("")}</div></div>`);
}
function chooseOpt(i) {
  const p = G.queue[0]; if (!p) return; const o = p.opts[i]; if (!o || (o.can && !o.can())) return;
  G.queue.shift(); o.run && o.run(); mapDirty = true; render();
}

// ================= 입력 =================
function act(d) {
  const c = d.c != null ? G.counties[+d.c] : null, si = +d.s, r = d.r != null ? realmOf(+d.r) : null;
  switch (d.a) {
    case "tab": G.tab = d.t; break;
    case "speed": G.speed = +d.v; if (G.speed) G.lastSpeed = G.speed; break;
    case "sel": G.sel = +d.c; G.tab = "county"; lastFrame = -1; break;
    case "opt": return chooseOpt(+d.i);
    case "hold": buildHolding(c, si, d.k); break;
    case "build": buildBld(c, si, d.k); break;
    case "grant": grant(c, si); break;
    case "revoke": revoke(c, si); break;
    case "patrol": if (G.gold >= PATROL_COST && c.owner === 0) { G.gold -= PATROL_COST; c.control = Math.min(100, c.control + 20); say(`${c.name}에 순찰대를 보냈습니다. 통제력 +20`); } break;
    case "war": declareWar(c); break;
    case "peace":
      if (G.war) { if (G.war.iAttack) endWar("peace"); else if (G.gold >= TRIBUTE) { G.gold -= TRIBUTE; endWar("peace", `공물 ${TRIBUTE}을 바치고 강화했습니다.`); } }
      break;
    case "marry": openMarriage(); break;
    case "kinmarry": openKinMarriage(+d.id); break;
    case "breakally": breakAlliance(r); break;
    case "scheme": startScheme(d.k, r); break;
    case "cancelscheme": if (G.scheme) { G.scheme = null; say("음모를 거두었습니다. 들인 돈은 돌려받지 못합니다."); } break;
    case "law": changeLaw(d.k); break;
    case "edu": educate(+d.id); break;
    case "feast": if (G.gold >= 100 && !G.cd.feast) { G.gold -= 100; G.prestige += 25; G.cd.feast = 24; own().forEach(x => x.control = Math.min(100, x.control + 5)); say("성대한 연회를 열었습니다. 위신 +25", "good"); } break;
    case "pilgrim": if (G.gold >= 80 && !G.cd.pilgrim) { G.gold -= 80; G.piety += 40; G.cd.pilgrim = 18; say(`${iga(G.ruler.name)} 성지 순례를 다녀왔습니다. 신앙심 +40`, "good"); } break;
    case "promote": promote(); break;
    case "help": showHelp(false); break;
  }
  render();
}
function showHelp(first) {
  const saved = first && hasSave();
  popup({ title:"왕관과 장원", img:portrait({ id:0, sex:"m", age:24, dna:{ s:0, h:1, e:0, b:2 } }, "crown0", "#5a2420", "#8a2a22"),
    text:`1066년, 당신은 작은 백작령 <b>발란</b>을 물려받은 하르트 가문의 영주입니다.<br><br>
      · 지도에서 백작령을 눌러 <b>장원</b>(성·도시·교회)과 건물을 지으세요. 직할 한도를 넘으면 <b>가신에게 하사</b>하세요.<br>
      · 영주는 늙고 죽습니다. <b>혼인</b>해 후계자를 남기세요. 기본 상속법은 <b>분할 상속</b>이라 자녀가 많으면 영지가 쪼개집니다.<br>
      · 자녀를 이웃 가문과 혼인시키면 <b>동맹</b>이 됩니다. 적에게는 <b>암살</b>과 <b>선동</b> 음모를 꾸밀 수 있습니다.<br>
      · <b>전쟁</b>은 달마다 전투와 공성으로 진행됩니다. 공작을 거쳐 <b>국왕</b>이 되면 승리합니다.<br><br>
      ▶ 버튼으로 시간을 흘려보내고, 스페이스바로 멈춥니다.`,
    opts: saved ? [{ t:"이어서 다스린다", run:() => { loadGame(); } }, { t:"새로 시작한다", run:() => { G.speed = 1; G.lastSpeed = 1; } }]
                : [{ t:first ? "통치를 시작한다" : "닫기", run:() => { if (first) { G.speed = 1; G.lastSpeed = 1; } } }] });
}
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (!b || b.disabled) return; act(b.dataset); });
document.addEventListener("pointerdown", () => { held = true; }, true);
document.addEventListener("pointerup", () => { held = false; if (pending) { pending = false; setTimeout(render, 0); } }, true);
document.addEventListener("pointercancel", () => { held = false; }, true);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " " && !G.queue.length) { e.preventDefault(); G.speed = G.speed ? 0 : (G.lastSpeed || 1); render(); }
  else if (["1", "2", "3"].includes(e.key) && !G.queue.length) { G.speed = G.lastSpeed = +e.key; render(); }
});

// ================= 저장 =================
const SAVE_KEY = "crown-holdings-v2";
function save() { try { const { queue, ...rest } = G; localStorage.setItem(SAVE_KEY, JSON.stringify({ ...rest, NEXT_ID })); } catch (e) {} }
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY)); if (!d || !d.counties) return;
    NEXT_ID = d.NEXT_ID || 1000; delete d.NEXT_ID;
    G = { ...d, queue:[], speed:0 }; mapDirty = true;
    say("저장된 연대기를 불러왔습니다. ▶ 버튼으로 시간을 흘려보내세요.");
  } catch (e) {}
}

// ================= 시작 =================
function newGame(restart) {
  NEXT_ID = 1;
  const ruler = mkChar({ name:"에드릭", sex:"m", age:24, st:{ dip:7, mar:8, stw:8, lrn:6, int:6 }, traits:["brave", "diligent"], dna:{ s:0, h:1, e:0, b:2 } });
  G = { y:1066, m:1, gold:200, prestige:50, piety:10, rank:0, manpower:1, gen:1, dyn:"하르트", capital:0, law:"gavel", lawLock:false,
        ruler, spouse:null, kids:[], sibs:[mkChar({ name:"마틸다", sex:"f", age:19 })],
        counties:COUNTY_DEFS.map((d, i) => ({ id:i, name:d.n, x:d.x, y:d.y, owner:0, dev:i === 0 ? 2 : ri(1, 3), control:i === 0 ? 70 : 80, slots:[null, null, null] })),
        realms:REALM_DEFS.map(d => ({ id:d.id, name:d.n, color:d.color, hat:d.hat || "crown0", ruler:d.id ? mkChar({ sex:"m", age:ri(28, 55) }) : null, mul:1, morale:1, dead:false, hostile:0, kinId:null })),
        war:null, scheme:null, log:[], queue:[], speed:0, lastSpeed:1, sel:0, tab:"county", nextEvent:ri(4, 7), truce:18, cd:{ feast:0, pilgrim:0 }, won:false, over:false };
  G.counties[0].slots[0] = mkSlot("castle");
  for (const d of REALM_DEFS) if (d.c) d.c.forEach(ci => { G.counties[ci].owner = d.id; START_HOLD[ci].forEach((hd, si) => { const s = mkSlot(hd[0]); s.b = [...hd[1]]; G.counties[ci].slots[si] = s; }); });
  mapDirty = true;
  say("1066년 1월, 에드릭 하르트가 발란 백작령을 물려받았습니다.");
  if (restart) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} G.speed = 1; }
  else showHelp(true);
  render();
}
let lastT = 0, acc = 0;
const SPEED_MS = [0, 1100, 550, 220];
function loop(t) {
  const dt = Math.min(250, t - lastT); lastT = t;
  if (G.speed > 0 && !G.queue.length && !G.over) {
    acc += dt; let n = 0;
    while (acc >= SPEED_MS[G.speed] && n < 3) { acc -= SPEED_MS[G.speed]; step(); n++; if (G.queue.length || G.over) { acc = 0; break; } }
    if (n) render();
  } else acc = 0;
  drawMap(t);
  requestAnimationFrame(loop);
}
function boot() {
  buildSprites(); genMap();
  const cv = $("map"); mapCtx = cv.getContext("2d");
  cv.addEventListener("click", e => {
    const b = cv.getBoundingClientRect();
    const x = Math.floor((e.clientX - b.left) / b.width * MW), y = Math.floor((e.clientY - b.top) / b.height * MH);
    const k = CMAP[clamp(y, 0, MH - 1) * MW + clamp(x, 0, MW - 1)];
    if (k >= 0) { G.sel = k; G.tab = "county"; lastFrame = -1; render(); }
  });
  newGame(false);
  requestAnimationFrame(loop);
}
boot();
</script>
</body>
