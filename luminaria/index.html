<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>루미나리아: Eight Fates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div>

<!-- 타이틀 -->
<section id="title" class="screen">
  <div class="title-art" id="titleArt"></div>
  <div class="title-box">
    <div class="logo"><span class="star">✦</span>LUMINARIA<small>Eight Fates</small></div>
    <p class="tagline">별등이 고르는 여덟 개의 운명, 그리고 색이 없는 단 하나의 빛</p>
    <div class="title-menu">
      <button class="btn gold" id="btnNew">새로 시작</button>
      <button class="btn" id="btnLoad">이어하기</button>
      <button class="btn" id="btnAlbumT">앨범</button>
      <button class="btn" id="btnSettingsT">설정</button>
    </div>
  </div>
</section>

<!-- 이름 입력 -->
<section id="naming" class="screen hidden">
  <div class="panel name-panel">
    <h2>학원 입학 서류</h2>
    <p>루미나리아 아카데미 특별 청강생. 당신의 이름을 적어주세요.</p>
    <input id="nameInput" maxlength="8" placeholder="이름" value="유안" autocomplete="off">
    <div class="row"><button class="btn" id="nameBack">돌아가기</button><button class="btn gold" id="nameOk">입학하기</button></div>
  </div>
</section>

<!-- 메인(대기) 화면 -->
<section id="hub" class="screen hidden">
  <div class="hub-left">
    <div class="panel date-card">
      <div class="compass">✦</div>
      <div>
        <div class="date" id="hDate"></div>
        <div class="slot" id="hSlot"></div>
        <div class="place">루미나리아 아카데미</div>
      </div>
    </div>
    <div class="panel">
      <h3>오늘의 소식</h3>
      <ul class="news" id="hNews"></ul>
    </div>
    <div class="panel">
      <h3>능력치</h3>
      <div id="hStats"></div>
    </div>
  </div>

  <div class="hub-center" id="hIdle"></div>

  <div class="hub-right">
    <div class="loc-list" id="hLocs"></div>
    <div class="sys-list">
      <button class="btn sys" id="btnInv">🎒 소지품</button>
      <button class="btn sys" id="btnAlbum">🖼️ 앨범</button>
      <button class="btn sys" id="btnSettings">⚙️ 설정</button>
      <button class="btn sys" id="btnToTitle">🏠 타이틀</button>
    </div>
  </div>

  <div class="hub-bottom panel" id="hGirls"></div>
</section>

<!-- 대화 장면 -->
<section id="scene" class="screen hidden">
  <img id="sChar" alt="">
  <div id="sChoices"></div>
  <div id="sBox">
    <div id="sName"></div>
    <img id="sFace" alt="">
    <div id="sText"></div>
    <div id="sNext">»</div>
  </div>
</section>

<div id="modal" class="hidden"><div class="modal-inner panel" id="modalInner"></div></div>
<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/game.js"></script>
</body>
</html>
