<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#140e24">
<meta name="description" content="멈춘 네 개의 종을 다시 울려 아침을 되찾는 도트 JRPG. 실드·브레이크·부스트 전투.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="여명의 종">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>여명의 종</title>
<link rel="preload" href="fonts/galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="title">

<!-- 타이틀 -->
<section id="title" class="screen" aria-label="타이틀">
  <canvas id="titleArt" aria-hidden="true"></canvas>
  <h1 class="logo"><span>여명의 종</span><small>BELLS OF DAWN</small></h1>
  <div class="title-box">
    <div class="title-menu">
      <button class="btn gold" id="btnContinue" hidden>이어하기</button>
      <button class="btn" id="btnNew">새 이야기</button>
      <button class="btn" id="btnLoadT">불러오기</button>
      <button class="btn" id="btnHelpT">전투 방법</button>
    </div>
    <p class="records" id="records"></p>
  </div>
  <p class="tap-hint">♪ 화면을 한 번 누르면 소리가 켜져요</p>
</section>

<!-- 필드 -->
<section id="field" class="screen" aria-label="필드">
  <canvas id="fcv"></canvas>
  <div class="hud">
    <span class="place" id="hudPlace"></span>
    <button class="icon-btn" id="btnMenu" aria-label="메뉴">☰</button>
  </div>
  <div id="pad">
    <div id="dpad" aria-label="이동">
      <button data-dir="up" class="up" aria-label="위">▲</button>
      <button data-dir="left" class="left" aria-label="왼쪽">◀</button>
      <button data-dir="right" class="right" aria-label="오른쪽">▶</button>
      <button data-dir="down" class="down" aria-label="아래">▼</button>
    </div>
    <button id="btnAct" class="act" aria-label="조사·말 걸기">조사</button>
  </div>
</section>

<!-- 세계 지도 -->
<section id="world" class="screen" aria-label="세계 지도">
  <canvas id="wcv"></canvas>
  <div id="wLabels"></div>
  <div class="hud"><span class="place">세계 지도</span><button class="icon-btn" id="btnWMenu" aria-label="메뉴">☰</button></div>
  <div id="wInfo"></div>
</section>

<!-- 전투 -->
<section id="battle" class="screen" aria-label="전투">
  <div id="bStage">
    <canvas id="bcv"></canvas>
    <div id="bTags"></div>
    <div id="bFx"></div>
    <div id="bOrder">
      <div class="orow"><b>R<span id="bRound">1</span></b><div class="icons" id="bOrderNow"></div></div>
      <div class="orow next"><b>다음</b><div class="icons" id="bOrderNext"></div></div>
    </div>
    <div id="bBanner"></div>
    <div id="bResult" hidden></div>
  </div>
  <div id="bSide">
    <div id="bParty"></div>
    <div id="bCmd">
      <div id="bWho"></div>
      <div id="bBoost" class="off">
        <button id="bBoostDn" aria-label="부스트 줄이기">－</button>
        <div class="lv"></div>
        <button id="bBoostUp" aria-label="부스트 올리기">＋</button>
      </div>
      <div id="bMenu"></div>
      <div id="bHelp"></div>
    </div>
  </div>
</section>

<!-- 엔딩 -->
<section id="ending" class="screen" aria-label="엔딩">
  <canvas id="endArt" aria-hidden="true"></canvas>
  <div id="endBox" hidden></div>
</section>

<!-- 겹쳐 뜨는 것들 -->
<div id="dlg" hidden>
  <div class="dbox">
    <img id="dFace" alt="" hidden>
    <div class="dmain"><div id="dName"></div><div id="dText"></div></div>
    <div id="dNext">▼</div>
  </div>
  <div id="dChoices"></div>
</div>
<div id="modal" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="tip" hidden></div>
<div id="chapter" hidden></div>
<div id="ring" hidden></div>
<div id="toast" hidden></div>
<div id="fade"></div>

<script src="js/sprites.js"></script>
<script src="js/data.js"></script>
<script src="js/party.js"></script>
<script src="js/battle.js"></script>
<script src="js/maps.js"></script>
<script src="js/story.js"></script>
<script src="js/gfx.js"></script>
<script src="js/sound.js"></script>
<script src="js/field.js"></script>
<script src="js/world.js"></script>
<script src="js/bview.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
